<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSK 단어 마스터</title>
    <style>
        /* 기존 스타일을 유지하되, 카드가 가려지는 문제를 해결하기 위한 CSS 수정 및 보완 */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* 단어 카드 스타일: 글자가 위쪽으로 가려지지 않도록 상단 여백(padding-top) 확보 및 overflow 조절 */
        .card {
            background-color: #fff;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: pointer;
            perspective: 1000px;
            margin-bottom: 20px;
            padding: 20px; /* 내부 여백을 충분히 주어 글자 잘림 방지 */
            box-sizing: border-box;
            overflow: visible; /* 자동 재생 애니메이션 시 글자가 가려지지 않도록 설정 */
        }

        .word-text {
            font-size: 48px;
            font-weight: bold;
            color: #333;
            margin: 10px 0;
            text-align: center;
            word-break: break-all;
            line-height: 1.2; /* 자모음이나 한자 상단이 잘리지 않도록 행고 확보 */
        }

        .meaning-text {
            font-size: 24px;
            color: #666;
            margin-top: 10px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f9f9f9;
            padding: 10px 15px;
            border-radius: 8px;
        }

        .slider-container label {
            font-weight: bold;
            font-size: 16px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }

        button.stop {
            background-color: #dc3545;
        }
        button.stop:hover {
            background-color: #bd2130;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>HSK 단어 마스터</h2>

    <div class="card" id="wordCard">
        <div class="word-text" id="chineseWord">漢字</div>
        <div class="meaning-text" id="wordMeaning">뜻 정보</div>
    </div>

    <div class="controls">
        <div class="slider-container">
            <label for="speedSlider">속도조절: <span id="speedValue">0.8</span>x</label>
            <input type="range" id="speedSlider" min="0.2" max="2.0" step="0.1" value="0.8">
        </div>

        <div class="button-group">
            <button id="btnAutoPlay">▶ 전체 자동 재생</button>
            <button id="btnStop" class="stop">⏹ 정지</button>
        </div>
        
        <div class="button-group">
            <button id="btnShuffle">🔀 섞어서 풀기</button>
            <button id="btnReset">🔄 모두 엎기</button>
        </div>
    </div>
</div>

<script>
    // 샘플 데이터 (기존 로직에 맞게 대체하여 사용하세요)
    const words = [
        { hanja: "💡 학습 모드", meaning: "원하는 모드를 선택하세요" },
        { hanja: "谢谢", meaning: "고맙다, 감사합니다" },
        { hanja: "再见", meaning: "다시 만나다, 안녕히 가세요" }
    ];
    
    let currentIndex = 0;
    let autoPlayInterval = null;

    const chineseWord = document.getElementById('chineseWord');
    const wordMeaning = document.getElementById('wordMeaning');
    const speedSlider = document.getElementById('speedSlider');
    const speedValue = document.getElementById('speedValue');
    const btnAutoPlay = document.getElementById('btnAutoPlay');
    const btnStop = document.getElementById('btnStop');

    // 슬라이더 조절 시 텍스트 반영 및 재생 속도 즉시 변경
    speedSlider.addEventListener('input', (e) => {
        const speed = e.target.value;
        speedValue.textContent = speed;
        
        // 현재 자동 재생 중이라면 속도를 즉시 재적용
        if (autoPlayInterval) {
            stopAutoPlay();
            startAutoPlay();
        }
    });

    function updateCard() {
        if(words[currentIndex]) {
            chineseWord.textContent = words[currentIndex].hanja;
            wordMeaning.textContent = words[currentIndex].meaning;
        }
    }

    function startAutoPlay() {
        // 슬라이더 값(초 단위 간격으로 변환하여 사용하거나 호출 주기 조절)
        // 예: 1배속일 때 2초라면, 속도가 낮아질수록(0.2) 간격이 길어지도록 설정 가능
        const speedMultiplier = parseFloat(speedSlider.value);
        const intervalTime = (2000 / speedMultiplier); // 배속 개념 적용 (0.2배속이면 10초마다, 2배속이면 1초마다)

        autoPlayInterval = setInterval(() => {
            currentIndex = (currentIndex + 1) % words.length;
            updateCard();
        }, intervalTime);
    }

    function stopAutoPlay() {
        if (autoPlayInterval) {
            clearInterval(autoPlayInterval);
            autoPlayInterval = null;
        }
    }

    btnAutoPlay.addEventListener('click', () => {
        stopAutoPlay();
        startAutoPlay();
    });

    btnStop.addEventListener('click', () => {
        stopAutoPlay();
    });

    // 초기 실행
    updateCard();
</script>

</body>
</html>
